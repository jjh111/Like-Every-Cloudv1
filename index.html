<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Like Every Cloud</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        color: #ddd;
        font-family: system-ui, sans-serif;
        /* Sky gradient — three.js renderer is alpha:true so this shows through. */
        background: linear-gradient(
          to bottom,
          #a8c8e8 0%,
          #dec699 65%,
          #c9a878 100%
        );
      }
      canvas { display: block; background: transparent; }

      /* Loading overlay — visible on first paint (before JS runs), faded
         out by app.ts once the scene is ready. Sits on top of the canvas
         so directors see a clean "loading…" instead of a black frame
         while shared.glb + heroes pull from disk. */
      #lec-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #4a3a28;
        font: 14px/1.4 system-ui, sans-serif;
        z-index: 2000;
        background: linear-gradient(to bottom, #a8c8e8 0%, #dec699 65%, #c9a878 100%);
        transition: opacity 0.6s ease-out;
        pointer-events: none;
      }
      #lec-loading.hidden { opacity: 0; }
      #lec-loading .lec-logo {
        /* Logo is a wordmark (~1.8:1). Width-based sizing with auto height
           lets the SVG's viewBox decide the aspect — no squashing if the
           logo file is ever swapped for a different aspect. */
        width: 320px;
        height: auto;
        max-width: 70vw;
        user-select: none;
      }
      #lec-loading .lec-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(58, 47, 34, 0.25);
        border-top-color: #3a2f22;
        border-radius: 50%;
        animation: lec-spin 0.9s linear infinite;
      }
      @keyframes lec-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="lec-loading">
      <img class="lec-logo" src="/like-every-cloud.svg" alt="Like Every Cloud" />
      <div class="lec-spinner"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
